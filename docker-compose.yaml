services:
  backend:
    build: ./backend
    container_name: conduit_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - backend_static:/app/staticfiles
    restart: on-failure

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_API_URL: ${BACKEND_API_URL}
    env_file:
      - .env
    container_name: conduit_frontend
    ports:
      - "8282:80"
    depends_on:
      - backend
    restart: on-failure

  db:
    image: postgres:15-alpine
    container_name: conduit_db
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: on-failure

volumes:
  db_data:
  backend_static:
