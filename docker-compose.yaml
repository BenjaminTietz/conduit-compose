services:
  backend:
    build: ./backend
    container_name: conduit_backend
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - backend_static:/app/staticfiles
    restart: on-failure

  frontend:
    build:
      context: ./frontend
    container_name: conduit_frontend
    ports:
      - "8282:80"
    depends_on:
      - backend
    restart: on-failure

  db:
    image: postgres:15-alpine
    container_name: conduit_db
    environment:
      POSTGRES_DB: conduit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: always

volumes:
  db_data:
  backend_static:
